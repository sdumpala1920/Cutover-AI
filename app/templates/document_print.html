<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ label }}</title>
    <style>
        body { max-width: 760px; margin: 40px auto; padding: 0 20px; font-family: Georgia, 'Times New Roman', serif; color: #1c1f1e; line-height: 1.6; }
        h1 { font-size: 24px; border-bottom: 2px solid #1c1f1e; padding-bottom: 10px; }
        pre { white-space: pre-wrap; word-wrap: break-word; font-family: Georgia, serif; font-size: 15px; }
        .notes { background: #f6f7f5; border-left: 3px solid #1f6f4f; padding: 10px 16px; margin-top: 24px; font-size: 14px; }
        @media print { body { margin: 0; } }
    </style>
</head>
<body>
    <h1>{{ label }}</h1>
    <pre>{{ content }}</pre>
    {% if notes %}
    <div class="notes"><strong>Notes:</strong><br>{{ notes }}</div>
    {% endif %}
</body>
</html>
