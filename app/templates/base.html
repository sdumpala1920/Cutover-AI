<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <meta name="theme-color" content="#1f6f4f">
    <title>{% block title %}Cutover to AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="site-nav">
        <a href="{{ url_for('today.today_view') }}">Today</a>
        <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
        <a href="{{ url_for('coach.landing') }}">Coach</a>
        <a href="{{ url_for('quiz.index') }}">Quiz</a>
        <a href="{{ url_for('certifications.index') }}">Certifications</a>
        <a href="{{ url_for('portfolio.index') }}">Portfolio</a>
        <a href="{{ url_for('resume.index') }}">Resume</a>
        <a href="{{ url_for('jobs.index') }}">Jobs</a>
        <a href="{{ url_for('interview.index') }}">Interview Log</a>
    </nav>
    <div class="page">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/today.js') }}"></script>
    <script src="{{ url_for('static', filename='js/coach.js') }}"></script>
</body>
</html>
